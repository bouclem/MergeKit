[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mergekit"
version = "0.0.3"
description = "A toolkit for merging AI models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["model-merging", "llm", "machine-learning", "pytorch"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# transformers will be added when full HF model loading lands.
dependencies = [
    "torch>=2.0",
    "safetensors>=0.4",
]

[project.scripts]
mergekit = "mergekit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.setuptools.packages.find]
include = ["mergekit*"]
